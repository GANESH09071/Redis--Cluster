version: '3.8'

x-node-common: &node-common
  image: redis-node-base:latest
  build:
    context: .
    dockerfile: Containerfile
  networks:
    redis-net:
  volumes:
    # Mount the parent directory's ansible/ssh folder to inject keys
    - ../ansible/ssh:/ansible-keys:ro
  # Ensure container stays running (runs sshd -D)
  restart: unless-stopped

services:
  redis-node-1:
    <<: *node-common
    container_name: redis-node-1
    hostname: redis-node-1
    networks:
      redis-net:
        ipv4_address: 10.10.0.11

  redis-node-2:
    <<: *node-common
    container_name: redis-node-2
    hostname: redis-node-2
    networks:
      redis-net:
        ipv4_address: 10.10.0.12

  redis-node-3:
    <<: *node-common
    container_name: redis-node-3
    hostname: redis-node-3
    networks:
      redis-net:
        ipv4_address: 10.10.0.13

  redis-node-4:
    <<: *node-common
    container_name: redis-node-4
    hostname: redis-node-4
    networks:
      redis-net:
        ipv4_address: 10.10.0.14

  redis-node-5:
    <<: *node-common
    container_name: redis-node-5
    hostname: redis-node-5
    networks:
      redis-net:
        ipv4_address: 10.10.0.15

  redis-node-6:
    <<: *node-common
    container_name: redis-node-6
    hostname: redis-node-6
    networks:
      redis-net:
        ipv4_address: 10.10.0.16

networks:
  redis-net:
    name: redis-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
